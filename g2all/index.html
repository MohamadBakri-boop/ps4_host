<!DOCTYPE html>
<html manifest="slopkit.manifest">
<head>
<meta charset="UTF-8">
<title>PS4 7.00 - 13.00 FW GoldHEN Host by Yossaf</title>
<link rel="stylesheet" href="../style.css">
<script>
    function DLProgress(e) {
        if (e.lengthComputable) {
            var Percent = Math.round((e.loaded / e.total) * 100);
            var msgs = document.getElementById("msgs");
            if (msgs) msgs.innerHTML = "جاري تثبيت الكاش لأول مرة: " + Percent + "%";
        }
    }
    
    function DisplayCacheProgress() {
        var msgs = document.getElementById("msgs");
        if (msgs) msgs.innerHTML = "تم تثبيت الكاش بنجاح! اغلق المتصفح واقطع الإنترنت الآن.";
    }

    if (window.applicationCache) {
        window.applicationCache.addEventListener("progress", DLProgress, false);
        window.applicationCache.addEventListener("cached", DisplayCacheProgress, false);
        window.applicationCache.addEventListener("updateready", function() {
            try { window.applicationCache.swapCache(); } catch(e){}
            DisplayCacheProgress();
        }, false);
    }

    function runExploit() {
        var msgs = document.getElementById("msgs");
        var uaFull = navigator.userAgent;
        var match = uaFull.match(/PlayStation 4[ /]([\d.]+)/i);
        var isPS4 = match !== null;
        var fwVersion = isPS4 ? match[1] : "Unknown";
        var fwNum = parseFloat(fwVersion);

        if (!isPS4) {
            if (msgs) msgs.innerHTML = "Only for PS4 with Firmware 7.00 to 13.00";
            return;
        }

        if (msgs) msgs.innerHTML = "Loading GoldHEN v2.4b18.10... Please Wait";

        var scriptPath = "";
        if (fwNum >= 7.00 && fwNum <= 8.52) scriptPath = "700/alert.js";
        else if (fwNum >= 9.00 && fwNum <= 9.60) scriptPath = "900/alert.js";
        else if (fwNum >= 10.00 && fwNum <= 11.02) scriptPath = "css/main.js";
        else if (fwNum >= 11.50 && fwNum <= 12.02) scriptPath = "slopkit/chain_lapse.js";
        else if (fwNum >= 12.50 && fwNum <= 13.00) scriptPath = "slopkit/chain_poops.js";

        if (scriptPath !== "") {
            var s = document.createElement('script');
            if (fwNum < 10.00 || fwNum >= 11.50) {
                s.type = 'module';
            }
            s.src = scriptPath;
            s.onerror = function() {
                if (msgs) msgs.innerHTML = "حدث خطأ أثناء تحميل الثغرة! أعد فتح المتصفح.";
            };
            if (fwNum >= 10.00 && fwNum <= 11.02) {
                s.onload = function() {
                    setTimeout(function() { if (typeof doJb === 'function') doJb(); }, 500);
                };
            }
            document.head.appendChild(s);
        } else {
            if (msgs) msgs.innerHTML = 'Unsupported Firmware: <span style="color: red;">' + fwVersion + '</span>';
        }
    }

    document.addEventListener("DOMContentLoaded", function() {
        setTimeout(function() {
            if (!navigator.onLine || (window.applicationCache && window.applicationCache.status !== 0)) {
                runExploit();
            }
        }, 500);
    });
</script>
</head>
<body>
    <h1>PS4 7.00 - 13.00 FW GoldHEN Host by Yossaf</h1>
    <hr><br>
    <h1 id="msgs" style="font-size: 30px; margin-top: 77px; margin-bottom: 455px;">جاري تجهيز الكاش...</h1>
    <h1 style="margin-top: 43px;">Special Thanks to: @_AlAzif ChendoChap @Kameleonre_ SiSTR0 Abc</h1>
</body>
</html>
