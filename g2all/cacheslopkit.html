<!DOCTYPE html>
<html manifest="slopkit.manifest">
<head>
    <meta charset="UTF-8">
    <title>PS4 Cache Installer</title>
    <link rel="stylesheet" href="../style.css">
    <script>
        function DLProgress(e) {
            if (e.lengthComputable) {
                var Percent = Math.round((e.loaded / e.total) * 100);
                document.getElementById("msgs").innerHTML = "جاري تثبيت الكاش: " + Percent + "%";
            }
        }
        
        function DisplayCacheProgress() {
            document.getElementById("msgs").innerHTML = "تم تثبيت الكاش بنجاح! جاري التوجه لتفعيل GoldHEN...";
            setTimeout(function(){
                window.location.href = "index.html";
            }, 1500);
        }

        window.applicationCache.addEventListener("progress", DLProgress, false);
        window.applicationCache.addEventListener("cached", DisplayCacheProgress, false);
        window.applicationCache.addEventListener("updateready", function() {
            try { window.applicationCache.swapCache(); } catch(e){}
            DisplayCacheProgress();
        }, false);
        
        // إذا كان الكاش مثبتاً بالفعل مسبقاً، احوله فوراً لـ index.html
        window.applicationCache.addEventListener("noupdate", function() {
            window.location.href = "index.html";
        }, false);
    </script>
</head>
<body>
    <h1 id="msgs" style="font-size: 30px; margin-top: 77px;">جاري تحميل الكاش... يرجى الانتظار</h1>
</body>
</html>
