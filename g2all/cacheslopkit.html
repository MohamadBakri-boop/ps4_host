<!DOCTYPE html>
<html manifest="slopkit.manifest">
<head>
    <meta charset="UTF-8">
    <title>PS4 Cache Installer</title>
    <link rel="stylesheet" href="../style.css">
    <script>
        function DLProgress(e) {
            Percent = (Math.round(e.loaded / e.total * 100));
            document.getElementById("msgs").innerHTML = "جاري تثبيت الكاش: " + Percent + "%";
        }
        function DisplayCacheProgress() {
            setTimeout(function() { document.getElementById("msgs").innerHTML = "تم تثبيت الكاش بنجاح! اغلق المتصفح واقطع الإنترنت."; }, 1000);
        }
        window.applicationCache.addEventListener("progress", DLProgress, false);
        window.applicationCache.ondownloaded = function() { DisplayCacheProgress(); };
        window.applicationCache.onnoupdate = function() { DisplayCacheProgress(); };
        window.applicationCache.onerror = function() { document.getElementById("msgs").innerHTML = "خطأ في التثبيت! امسح بيانات المتصفح وأعد المحاولة."; };
    </script>
</head>
<body>
    <h1 id="msgs" style="font-size: 30px; margin-top: 77px;">جاري تحميل الكاش... يرجى الانتظار</h1>
</body>
</html>
